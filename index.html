<!doctype html>
<html lang="fr">
<head>

<title>Quai SNCB</title>

<meta name="apple-mobile-web-app-title" content="Quai">

<style>
/* Layout: full-bleed schematic map of the Belgian network, floating Liquid Glass chrome (top pills, bottom sheet, tab bar). */
:root {
  --land: #EEF1E8; --land-out: #E3E6DE; --forest: #CFE0C2; --urban: #F7F3EC; --water: #B9D5EE;
  --net: #A7B0AA; --border: #B9BFB6; --label: #59625D;
  --ink: #0D1512; --ink-2: #55605A; --ink-3: #8A948F; --hair: rgba(13,21,18,.08);
  --glass: rgba(255,255,255,.50); --glass-strong: rgba(250,251,250,.74); --glass-inset: rgba(255,255,255,.55);
  --rim: rgba(255,255,255,.95); --rim-low: rgba(255,255,255,.18); --shade: rgba(20,36,28,.16);
  --accent: #0A5FC8; --accent-soft: rgba(10,95,200,.12); --route: #0A5FC8; --route-glow: rgba(10,95,200,.22);
  --ok: #157A4C; --ok-bg: rgba(31,160,100,.16); --warn: #9A5A00; --warn-bg: rgba(240,160,30,.22); --bad: #B8261F; --bad-bg: rgba(220,60,50,.15);
  --chip: rgba(255,255,255,.78);
  --gap-edge: max(8px, env(safe-area-inset-left, 0px));
  --dock-h: 62px; --dock-b: max(10px, calc(env(safe-area-inset-bottom, 0px) - 22px));
  --f-display: "Bricolage Grotesque", -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --land: #1C2226; --land-out: #161B1E; --forest: #1F2B24; --urban: #272D31; --water: #0F2234;
  --net: #4B565A; --border: #3A4448; --label: #9AA6A9;
  --ink: #F1F5F3; --ink-2: #AAB5B1; --ink-3: #76817D; --hair: rgba(255,255,255,.09);
  --glass: rgba(26,30,34,.46); --glass-strong: rgba(30,34,39,.78); --glass-inset: rgba(255,255,255,.07);
  --rim: rgba(255,255,255,.38); --rim-low: rgba(255,255,255,.05); --shade: rgba(0,0,0,.5);
  --accent: #5AA2FF; --accent-soft: rgba(90,162,255,.16); --route: #5AA2FF; --route-glow: rgba(90,162,255,.28);
  --ok: #4FD796; --ok-bg: rgba(79,215,150,.15); --warn: #FFBC57; --warn-bg: rgba(255,188,87,.16); --bad: #FF7A70; --bad-bg: rgba(255,122,112,.16);
  --chip: rgba(255,255,255,.10); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --land: #1C2226; --land-out: #161B1E; --forest: #1F2B24; --urban: #272D31; --water: #0F2234;
  --net: #4B565A; --border: #3A4448; --label: #9AA6A9;
  --ink: #F1F5F3; --ink-2: #AAB5B1; --ink-3: #76817D; --hair: rgba(255,255,255,.09);
  --glass: rgba(26,30,34,.46); --glass-strong: rgba(30,34,39,.78); --glass-inset: rgba(255,255,255,.07);
  --rim: rgba(255,255,255,.38); --rim-low: rgba(255,255,255,.05); --shade: rgba(0,0,0,.5);
  --accent: #5AA2FF; --accent-soft: rgba(90,162,255,.16); --route: #5AA2FF; --route-glow: rgba(90,162,255,.28);
  --ok: #4FD796; --ok-bg: rgba(79,215,150,.15); --warn: #FFBC57; --warn-bg: rgba(255,188,87,.16); --bad: #FF7A70; --bad-bg: rgba(255,122,112,.16);
  --chip: rgba(255,255,255,.10); color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--land-out); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tn { font-variant-numeric: tabular-nums; }

/* ---------- Map ---------- */
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; display: block; background: var(--land-out); }
#map .sea { fill: var(--water); }
#map .be { fill: var(--land); stroke: var(--border); stroke-width: 1.2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
#map .river { fill: none; stroke: var(--water); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#map .net { fill: none; stroke: var(--net); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .9; }
#map .stn { fill: var(--land); stroke: var(--net); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
#map .lbl text { fill: var(--label); stroke: var(--land); paint-order: stroke; stroke-linejoin: round; font-family: var(--f-body); font-weight: 600; }
#map .lbl .t1 { font-family: var(--f-display); font-weight: 700; fill: var(--ink-2); font-size: 1.15em; }
#map .lbl .t2 { font-size: .9em; }
#map .lbl .t3 { font-size: .85em; }
#map .lbl .cty { font-size: .85em; letter-spacing: .5em; fill: var(--ink-3); stroke: none; font-weight: 600; }
#map:not(.z2) .lbl .t2, #map:not(.z3) .lbl .t3, #map.z3 .lbl .t1.bxl { display: none; }
#map.has-route .net, #map.has-route .stn { opacity: .55; }
#map.has-route .lbl text:not(.cty) { opacity: .5; }
#map .r-glow { fill: none; stroke: var(--route-glow); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#map .r-line { fill: none; stroke: var(--route); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#map .r-dash { fill: none; stroke: var(--route); stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .8; }
#map .r-stop { fill: #fff; stroke: var(--route); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
#map .r-end { fill: var(--route); stroke: #fff; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
#map .r-lbl { fill: var(--ink); stroke: var(--land); paint-order: stroke; stroke-linejoin: round; font-family: var(--f-display); font-weight: 700; }
#map .r-train { fill: var(--route); stroke: #fff; stroke-width: 3; vector-effect: non-scaling-stroke; }
#map .r-pulse { fill: var(--route); opacity: .35; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: .5; } to { transform: scale(2.6); opacity: 0; } }

/* ---------- Liquid Glass ---------- */
.glass {
  position: relative; isolation: isolate;
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(190%) brightness(1.04);
  backdrop-filter: blur(22px) saturate(190%) brightness(1.04);
  box-shadow: inset 0 1px 1px var(--rim), inset 0 -1px 1px var(--rim-low), 0 10px 34px -6px var(--shade), 0 1px 3px var(--shade);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
  background: linear-gradient(140deg, var(--rim) 0%, transparent 32%, transparent 64%, var(--rim) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: .9;
}
.glass.strong { background: var(--glass-strong); }
.lens { position: relative; overflow: hidden; transition: transform .35s cubic-bezier(.3,1.6,.5,1), background-color .2s; }
.lens::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.45), transparent 60%);
}
.lens:hover::after { opacity: .6; }
.lens:active { transform: scale(.955); }
.lens:active::after { opacity: 1; }

/* ---------- Top bar ---------- */
.top { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: flex-end; align-items: center; gap: 10px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 16px 0 7px; border-radius: 23px; }
.brand-mark { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: inset 0 1px 1px rgba(255,255,255,.5); }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1; letter-spacing: -.02em; }
.brand small { display: block; font-size: 10.5px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; margin-top: 2px; }
.status { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; font-weight: 700; font-size: 14px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.status.demo i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.status.demo { color: var(--warn); }
.status:not(.demo) { color: var(--ok); }


/* ---------- Vraie carte ---------- */
#glmap { position: fixed; inset: 0; z-index: 0; opacity: 0; transition: opacity .6s ease; background: var(--land-out); }
#glmap.on { opacity: 1; }
.maplibregl-ctrl-top-left { top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); }
.maplibregl-ctrl-attrib.maplibregl-compact { background: var(--glass-strong); color: var(--ink-2); border-radius: 14px; box-shadow: 0 2px 8px var(--shade); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.maplibregl-ctrl-attrib a { color: var(--ink-2); }
.maplibregl-ctrl-attrib.maplibregl-compact-show { max-width: calc(100vw - 190px); }
.map-lbl { padding: 6px 11px; border-radius: 13px; font: 700 14px/1.1 var(--f-display); color: var(--ink); white-space: nowrap; pointer-events: none;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%); box-shadow: inset 0 1px 1px var(--rim), 0 4px 14px -2px var(--shade); }
.map-train { width: 22px; height: 22px; border-radius: 50%; background: var(--route); border: 3px solid #fff; box-shadow: 0 2px 10px var(--shade); position: relative; }
.map-train::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: var(--route); z-index: -1; animation: pulse2 1.8s ease-out infinite; }
@keyframes pulse2 { from { transform: scale(1); opacity: .5; } to { transform: scale(2.8); opacity: 0; } }
.recenter { display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 20px; font-weight: 700; font-size: 14px; color: var(--accent); }

/* ---------- Sheet ---------- */
.sheet {
  position: fixed; z-index: 15; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
  bottom: 8px; height: var(--sheet-h, 60vh);
  border-radius: 40px; display: flex; flex-direction: column; overflow: hidden;
  transition: height .45s cubic-bezier(.2,.9,.25,1.05);
}
.sheet.dragging { transition: none; }
@media (min-width: 860px) {
  .sheet { right: auto; width: 440px; left: max(20px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 72px); height: auto !important; bottom: 20px; }
  .grab { display: none; }
}
.grab { flex: none; height: 22px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.grab::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--ink-3); opacity: .5; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px 8px; min-height: 44px; touch-action: none; }
.sheet-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -.025em; margin: 0; flex: 1; min-width: 0; text-wrap: balance; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); flex: none; box-shadow: inset 0 1px 1px var(--rim), 0 1px 2px var(--shade); }
.icon-btn[aria-pressed="true"] { color: var(--warn); }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 2px 16px calc(var(--dock-b) + var(--dock-h) + 10px); -webkit-overflow-scrolling: touch; }
.sheet-body > * + * { margin-top: 14px; }
.sheet-body {
  -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - var(--dock-b) - var(--dock-h) + 2px), transparent calc(100% - var(--dock-b) - var(--dock-h) / 2));
  mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - var(--dock-b) - var(--dock-h) + 2px), transparent calc(100% - var(--dock-b) - var(--dock-h) / 2));
}
@media (min-width: 860px) { .sheet-body { padding-bottom: 92px; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 88px), transparent calc(100% - 50px)); mask-image: linear-gradient(to bottom, #000 calc(100% - 88px), transparent calc(100% - 50px)); } }

/* ---------- Tab bar ---------- */
.dock { position: fixed; z-index: 20; bottom: var(--dock-b); left: max(18px, calc(env(safe-area-inset-left, 0px) + 10px)); right: max(18px, calc(env(safe-area-inset-right, 0px) + 10px)); display: flex; gap: 10px; align-items: center; }
@media (min-width: 860px) { .dock { right: auto; width: 420px; left: max(30px, calc(env(safe-area-inset-left, 0px) + 10px)); bottom: 30px; } }
.dock .glass { background: var(--glass-strong); box-shadow: inset 0 1px 1px var(--rim), inset 0 -1px 1px var(--rim-low), 0 6px 24px -4px var(--shade), 0 0 0 .5px var(--hair); }
.tabs { flex: 1; height: var(--dock-h); border-radius: calc(var(--dock-h) / 2); display: flex; padding: 4px; gap: 2px; }
.tab { flex: 1; border-radius: calc(var(--dock-h) / 2 - 4px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); }
.tab svg { width: 23px; height: 23px; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.fab { width: var(--dock-h); height: var(--dock-h); border-radius: 50%; display: grid; place-items: center; flex: none; }
.fab svg { width: 25px; height: 25px; }

/* ---------- Search form ---------- */
.inset { background: var(--glass-inset); border-radius: 24px; box-shadow: inset 0 1px 1px var(--rim), 0 1px 2px var(--hair); }
.od { position: relative; padding: 4px 0; }
.field { display: grid; grid-template-columns: 22px 44px 1fr; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 12px 64px 12px 16px; min-height: 54px; }
.field .lab { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.field .val { font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.field .val.ph { color: var(--ink-3); font-weight: 600; }
.ring { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--route); background: var(--land); justify-self: center; }
.ring.fill { background: var(--route); border-color: var(--route); box-shadow: 0 0 0 3px var(--accent-soft); }
.od-sep { height: 1px; background: var(--hair); margin-left: 54px; margin-right: 64px; }
.od::before { content: ""; position: absolute; left: 26px; top: 36px; bottom: 36px; border-left: 2px dotted var(--route); opacity: .6; }
.swap { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); box-shadow: inset 0 1px 1px var(--rim), 0 2px 6px var(--shade); }
.swap:active { transform: translateY(-50%) scale(.92) rotate(180deg); }
.when { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 18px; background: var(--glass-inset); box-shadow: inset 0 1px 1px var(--rim); }
.seg button { padding: 7px 13px; border-radius: 15px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); box-shadow: 0 1px 4px var(--shade), inset 0 1px 1px var(--rim); }
.dt { flex: 1; min-width: 150px; height: 38px; border-radius: 19px; border: 0; padding: 0 14px; font: 600 14px var(--f-body); color: var(--ink); background: var(--glass-inset); box-shadow: inset 0 1px 1px var(--rim); }
.now-btn { height: 38px; padding: 0 14px; border-radius: 19px; font-weight: 700; font-size: 14px; color: var(--accent); background: var(--accent-soft); }

/* ---------- Lists ---------- */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); padding: 6px 4px 0; }
.list { display: flex; flex-direction: column; gap: 10px; }
.card { display: block; width: 100%; text-align: left; padding: 14px 16px; border-radius: 22px; background: var(--glass-inset); box-shadow: inset 0 1px 1px var(--rim), 0 1px 2px var(--hair); }
.conn { display: flex; flex-direction: column; gap: 9px; }
.conn .r { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.conn .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.conn .times { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 25px; letter-spacing: -.02em; line-height: 1; min-width: 0; }
.conn .times .bar { flex: none; width: 34px; height: 2px; background: linear-gradient(90deg, var(--route), var(--route)); border-radius: 2px; align-self: center; position: relative; opacity: .7; }
.conn .times .bar::before, .conn .times .bar::after { content: ""; position: absolute; top: -4px; width: 6px; height: 6px; border-radius: 50%; border: 2px solid var(--route); background: var(--land); }
.conn .times .bar::before { left: -4px; } .conn .times .bar::after { right: -4px; background: var(--route); }
.conn .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 15px; font-weight: 500; color: var(--ink-2); }
.pill.sm { height: 26px; padding: 0 10px; font-size: 13px; gap: 6px; }
.vchip { display: inline-flex; align-items: baseline; gap: 5px; height: 26px; align-items: center; padding: 0 10px; border-radius: 9px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--hair); font-weight: 800; font-size: 15px; white-space: nowrap; }
.vchip small { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.vchip.chg { background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
.conn.gone { opacity: .55; }
.late { color: var(--warn); font-size: .58em; font-weight: 700; margin-left: 3px; letter-spacing: 0; vertical-align: .35em; }
.late.bad { color: var(--bad); }
s.sched { color: var(--ink-3); font-size: .55em; font-weight: 600; text-decoration-thickness: 1.5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 9px; font-size: 13px; font-weight: 700; background: var(--chip); box-shadow: inset 0 0 0 1px var(--hair); white-space: nowrap; }
.chip.t-IC, .chip.t-EXP, .chip.t-EUR, .chip.t-ICE, .chip.t-THA { background: var(--accent); color: #fff; box-shadow: none; }
.chip.brand { font-family: var(--f-display); font-weight: 800; letter-spacing: .02em; background: var(--chip); }
.chip.brand::after { content: ""; width: 3px; height: 13px; background: var(--accent); border-radius: 2px; transform: skew(-18deg); margin-left: 2px; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.quai { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 44px; height: 44px; padding: 0 6px; border-radius: 13px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--hair); font-family: var(--f-display); font-size: 21px; font-weight: 800; line-height: 1; }
.quai small { font-family: var(--f-body); font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px; }
.quai.chg { background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
.dep { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; }

const SPEED = { IC: 98, L: 72, S: 62 };

const Demo = (() => {
  const lines = LINES.map(([type, names], idx) => {

  }));
  // per-direction cumulative offsets (seconds from terminus departure)
  function stopsDir(L, dir) { const st = dir ? [...L.st].reverse() : L.st; const seg = dir ? [...L.seg].reverse() : L.seg; const cum = [0]; seg.forEach((v, i) => cum.push(cum[i] + v)); return { st, cum }; }

  function delayProfile(id, n) {
    const h = hash(id); const d = [0, 0, 0, 0, 0, 0, 0, 120, 120, 240, 420, 60, 0][h % 13];

  }
  function vehicle(L, dir, T0) {
    const { st, cum } = stopsDir(L, dir);
    const id = `D.${L.idx}.${dir}.${T0}`;
    const num = trainNo(L, dir, T0);
    const dp = delayProfile(id, st.length);
    const stops = st.map((s, k) => {
      const dly = k >= dp.from ? dp.d : 0;
      const arr = k ? T0 + cum[k] - 60 : null, dep = k < st.length - 1 ? T0 + cum[k] : null;
      return { name: s.name, lat: s.lat, lon: s.lon, arr, dep, arrDelay: dly, depDelay: dly, platform: String(hash(s.name + L.idx + dir) % 11 + 1), canceled: false };

  }
  function nextRun(L, dir, k, earliest) { const { cum } = stopsDir(L, dir); return Math.ceil((earliest - cum[k] - L.off) / L.period) * L.period + L.off; }

    const dist = new Map(), prev = new Map(), q = [];
    const key = (n, l) => n + '|' + l;
    (adj.get(from) || []).forEach(e => { const k = key(from, e.line); dist.set(k, 0); q.push([0, from, e.line]); });
    let best = null;
    while (q.length) {
      q.sort((a, b) => a[0] - b[0]); const [c, n, l] = q.shift();
      if (c > (dist.get(key(n, l)) ?? Infinity)) continue;
      if (n === to) { best = key(n, l); break; }
      for (const e of adj.get(n) || []) {
        const nc = c + e.cost + (e.line !== l ? 900 : 0), k = key(e.to, e.line);
        if (nc < (dist.get(k) ?? Infinity)) { dist.set(k, nc); prev.set(k, key(n, l) + '>' + e.line); q.push([nc, e.to, e.line]); }
      }
    }
    if (!best) return null;
    const path = []; let k = best;
    while (k) { const [n, l] = k.split('|'); path.unshift({ n, l: +l }); const p = prev.get(k); if (!p) break; const [pk] = p.split('>'); k = pk; }
    // path entries: station + line used to arrive; normalise into legs
    const legs = []; let cur = null;
    for (let i = 1; i < path.length; i++) {
      const line = path[i].l;

    }
    return legs;
  }

    const legs = route(from.name, to.name);

    for (let guard = 0; out.length < 8 && guard < 30; guard++) {
      let earliest = start, legsOut = [];
      for (const lg of legs) {
        const L = lines[lg.line];
        const fi = L.st.findIndex(s => s.name === lg.from), ti = L.st.findIndex(s => s.name === lg.to);
        const dir = fi < ti ? 0 : 1; const { st } = stopsDir(L, dir);

      }

})();

function legFromVehicle(v, k, k2) {

    <div class="date">${esc(fD.format(new Date(c.dep.time * 1000)))} · <span class="tn">${dur(total)}${dist ? ' · ' + km(dist) : ''}</span></div>
    ${ts ? `<div class="live-row"><i></i><span>${esc(ts.text)}</span><span>${S.live ? 'temps réel' : 'simulation'}</span></div>` : ''}
    ${compoButton(comp, c.occ || l0.occ)}
    <div>${c.legs.map((l, i) => {
      const stops = segs[i];
      const st = l.vehicle ? trainState(l.vehicle) : null;
      const vIdx = s => l.vehicle ? l.vehicle.stops.indexOf(s) : -1;
      const xfer = i < c.legs.length - 1 ? (() => { const wait = c.legs[i + 1].from.time + c.legs[i + 1].from.delay - (l.to.time + l.to.delay); return `<li class="xfer"><span></span><span class="dot"></span><span class="sn">Correspondance · ${dur(wait)} · voie ${esc(c.legs[i + 1].from.platform || '?')}</span><span></span></li>`; })() : '';
      return `<button class="leg-h" data-leg="${i}">${chip(l.short, l.type)}<span>vers ${esc(l.direction || l.to.station)}</span><span class="go">Train ${I.chev}</span></button>
      <ul class="tl">${stops.map((s, k) => {
        const end = k === 0 || k === stops.length - 1;
        const t = k === 0 ? (s.dep ?? s.time) : (s.arr ?? s.time), d = k === 0 ? (s.depDelay ?? s.delay ?? 0) : (s.arrDelay ?? s.delay ?? 0);
        const vi = vIdx(s);
        const past = st && vi >= 0 && (st.kind === 'done' || vi < st.idx || (vi === st.idx && st.kind === 'between'));
        const here = st && vi >= 0 && vi === st.idx && st.kind === 'at';
        return `<li class="${end ? 'end' : ''} ${past ? 'past' : ''} ${here ? 'train-here' : ''}"><span class="tt tn">${t ? hm(t) : ''}${lateTag(d)}</span><span class="dot"></span><span class="sn">${esc(s.name || s.station)}</span><span class="pf">${end && s.platform ? 'voie ' + esc(s.platform) : ''}</span></li>`;
      }).join('')}${xfer}</ul>`;
    }).join('')}</div>
    <button class="btn lens ${isFavPair(c) ? 'on' : ''}" id="favTrip">${isFavPair(c) ? I.starF + ' Dans vos favoris' : I.star + ' Épingler ce trajet'}</button>
    ${demoNote()}`;
    if ($('#strip')) $('#strip').scrollLeft = keepSl;
    bindCompoButton(v, comp, c.occ || l0.occ, l0.type, l0.short);
    body.querySelectorAll('.leg-h').forEach(b => b.onclick = () => { const l = c.legs[+b.dataset.leg]; push({ type: 'train', id: l.vehicleId, date: l.from.time, short: l.short, type_: l.type, board: l.from.station, occ: l.occ || (c.legs.length === 1 ? c.occ : null) }); });
    $('#favTrip').onclick = () => { const f = { from: c.dep.station, to: c.arr.station }; if (isFavPair(c)) S.favs = S.favs.filter(x => !(x.from === f.from && x.to === f.to)); else S.favs = [f, ...S.favs].slice(0, 12); store.set('favs', S.favs); drawn(); };
    if (current() === v) {
      const before = JSON.stringify(focus);
      setRoute({ segments: segs, ends: [segs[0][0], segs[segs.length - 1].slice(-1)[0]], labels: [segs[0][0], segs[segs.length - 1].slice(-1)[0]].map(s => ({ ...s, name: s.name || s.station })), train: ts && ts.kind !== 'done' ? ts.pos : null });
      if (before === JSON.stringify(focus)) { /* keep */ }
    }
  };
  drawn();
  // load vehicles + composition
  try {
    await Promise.all(c.legs.map(async l => { if (!l.vehicle) l.vehicle = await getVehicle(l.vehicleId, l.from.time); }));
  } catch {}
  if (v.comp === undefined) { try { v.comp = l0.vehicle ? await getComposition(l0.vehicle) : null; } catch { v.comp = null; } }
  if (current() === v) drawn();
  tick = setInterval(async () => {
    if (current() !== v) return;
    if (S.live) { for (const l of c.legs) { try { S.vehCache.delete(l.vehicleId); l.vehicle = await getVehicle(l.vehicleId, l.from.time); } catch {} } }
    if (current() === v) drawn();
  }, 45000);
}
const isFavPair = c => S.favs.some(f => f.from === c.dep.station && f.to === c.arr.station);

/* ================= View: train ================= */
async function renderTrain(v) {
  setHead({ title: v.short, back: S.stack.length > 1 });
  body.innerHTML = `<div class="list">${skel(1)}</div>${skel(1)}${skel(1)}`;
  let veh;
  try { veh = await getVehicle(v.id, v.date); } catch { if (current() === v) body.innerHTML = `<div class="err">Les données de ce train ne sont pas disponibles pour le moment.<br><button id="retry">Réessayer</button></div>`; const r = $('#retry'); if (r) r.onclick = () => render(); return; }
  if (current() !== v) return;
  const draw = (comp) => {
    const keepSl = $('#strip')?.scrollLeft || 0;
    const st = trainState(veh), stops = veh.stops;
    const first = stops[0], last = stops[stops.length - 1];
    const d0 = first.dep + first.depDelay, d1 = last.arr + last.arrDelay, s0 = first.dep, s1 = last.arr;
    const dist = routeKm(stops);
    const maxDelay = Math.max(...stops.map(s => Math.max(s.arrDelay || 0, s.depDelay || 0)));
    const curDelay = st ? (stops[st.idx]?.depDelay ?? 0) : 0;
    const nextStop = st && st.kind !== 'done' ? (st.kind === 'between' ? st.next : stops[Math.min(st.idx + (st.kind === 'at' ? 1 : 0), stops.length - 1)]) : null;
    body.innerHTML = `<div class="d-head"><span class="chip brand">SNCB</span>${chip(veh.short, veh.type)}${pill(st && st.kind !== 'before' ? curDelay : 0, stops.every(s => s.canceled))}</div>
    <div class="ends"><div><div class="big tn">${hm(s0)}</div><div class="nm">${esc(first.name)}</div></div><div class="track"><span></span><span></span></div><div><div class="big tn">${hm(s1)}</div><div class="nm">${esc(last.name)}</div></div></div>
    <div class="date">${esc(fD.format(new Date(first.dep * 1000)))} · <span class="tn">${dur(d1 - d0)}${dist ? ' · ' + km(dist) : ''}</span></div>
    ${st ? `<div class="live-row"><i></i><span>${esc(nextStop && st.kind !== 'before' ? `Prochain arrêt : ${nextStop.name} ${hm((nextStop.arr ?? nextStop.dep) + (nextStop.arrDelay || 0))}` : st.text)}</span><span>${S.live ? 'temps réel' : 'simulation'}</span></div>` : ''}
    ${st ? `<div class="note">${esc(st.text)}${maxDelay >= 60 ? ` · retard max. observé ${Math.round(maxDelay / 60)} min` : ''}</div>` : ''}
    ${compoButton(comp, v.occ)}
    <ul class="tl">${stops.map((s, k) => {
      const end = k === 0 || k === stops.length - 1;
      const t = k === 0 ? s.dep : (s.arr ?? s.dep), d = k === 0 ? s.depDelay : s.arrDelay;
      const past = st && (st.kind === 'done' || k < st.idx || (k === st.idx && st.kind === 'between'));
      const here = st && k === st.idx && st.kind === 'at';
      const mine = v.board && norm(s.name) === norm(v.board);
      return `<li class="${end || mine ? 'end' : ''} ${past ? 'past' : ''} ${here ? 'train-here' : ''}"><span class="tt tn">${s.canceled ? '<s>' : ''}${t ? hm(t) : ''}${s.canceled ? '</s>' : ''}${lateTag(d || 0)}</span><span class="dot"></span><span class="sn">${esc(s.name)}${s.canceled ? ' · supprimé' : ''}</span><span class="pf">${s.platform ? 'voie ' + esc(s.platform) : ''}</span></li>`;
    }).join('')}</ul>
    ${demoNote()}`;
    if ($('#strip')) $('#strip').scrollLeft = keepSl;
    bindCompoButton(v, comp, v.occ, veh.type, veh.short);
    setRoute({ segments: [stops], ends: [first, last], labels: [first, last], train: st && st.kind !== 'done' && st.kind !== 'before' ? st.pos : null });
  };
  draw(undefined);
  const comp = await getComposition(veh).catch(() => null);
  if (current() !== v) return;
  draw(comp);
  tick = setInterval(async () => {
    if (current() !== v) return;
    if (S.live) { try { S.vehCache.delete(v.id); veh = await getVehicle(v.id, v.date); } catch {} }
    if (current() === v) draw(comp);
  }, 30000);
}

/* ================= View: board ================= */
let boardReq = 0;
async function loadBoard() {
  const my = ++boardReq; S.board = null; S.boardErr = null; renderBoardList();
  try { const r = S.live ? await Live.board(S.boardSt) : Demo.board(S.boardSt, nowS()); if (my === boardReq) S.board = r; }
  catch (e) { if (my === boardReq) S.boardErr = true; }
  if (my === boardReq) renderBoardList();
}
function renderBoard() {
  setHead({ title: 'Départs' });
  body.innerHTML = `<div class="od inset" style="padding:0"><button class="field" id="bSt" style="padding-right:16px"><span class="ring fill"></span><span class="lab">Gare</span><span class="val">${esc(S.boardSt.name)}</span></button></div>
    <div id="boardList"></div>${demoNote()}`;
  $('#bSt').onclick = () => openPicker('Quelle gare ?', st => { S.boardSt = st; remember(st); store.set('boardSt', st.name); render(); loadBoard(); });
  renderBoardList();
  setRoute({ ends: [S.boardSt], labels: [S.boardSt], pts: [S.boardSt] });
  if (!S.board && !S.boardErr) loadBoard();
  tick = setInterval(() => current().type === 'board' && loadBoard(), 60000);
}
function renderBoardList() {
  const box = $('#boardList'); if (!box) return;
  if (S.boardErr) { box.innerHTML = `<div class="err">Le tableau des départs n'a pas pu être chargé.<br><button id="retry">Réessayer</button></div>`; $('#retry').onclick = loadBoard; return; }
  if (!S.board) { box.innerHTML = `<div class="list">${skel(4)}</div>`; return; }
  if (!S.board.length) { box.innerHTML = `<div class="empty"><b>Aucun départ</b>Pas de train annoncé dans l'heure qui vient.</div>`; return; }
  box.innerHTML = `<div class="eyebrow">Prochains départs · mis à jour ${hm(nowS())}</div><div class="list" style="margin-top:8px">${S.board.map((d, i) => `
    <button class="card dep lens ${d.canceled ? 'cxl' : ''}" data-i="${i}">
      <div class="t tn">${hm(d.time)}${d.delay >= 60 ? `<span class="late ${d.delay >= 300 ? 'bad' : ''}">+${Math.round(d.delay / 60)} min</span>` : ''}</div>
      <div style="min-width:0"><div class="dest">${esc(d.dest)}</div><div class="sub">${chip(d.short, d.type)}${d.canceled ? '<span class="pill bad" style="height:24px"><i></i>Supprimé</span>' : ''}</div></div>
      ${quai(d.platform, d.platformChanged)}
    </button>`).join('')}</div>`;
  box.querySelectorAll('.dep').forEach(b => b.onclick = () => { const d = S.board[+b.dataset.i]; push({ type: 'train', id: d.vehicleId, date: d.date, short: d.short, type_: d.type, board: S.boardSt.name, occ: d.occ }); });
}

/* ================= View: favourites ================= */
function renderFavs() {
  setHead({ title: 'Favoris' });
  const rec = S.recents.map(findSt).filter(Boolean);
  body.innerHTML = `${S.favs.length ? `<div class="list">${S.favs.map((f, i) => `
      <div class="card fav"><button class="r" data-i="${i}" style="text-align:left">${esc(f.from)} ${I.arrow} ${esc(f.to)}</button>
      <button class="icon-btn lens" data-del="${i}" aria-label="Retirer ${esc(f.from)} – ${esc(f.to)}">${I.x}</button></div>`).join('')}</div>`
    : `<div class="empty"><b>Aucun trajet épinglé</b>Touchez l'étoile sur un itinéraire pour le retrouver ici en un geste.</div>`}
    ${rec.length ? `<div class="eyebrow">Gares récentes</div><div class="list">${rec.map(s => `<button class="card lens" data-st="${esc(s.name)}" style="display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px"><span class="brand-mark" style="width:30px;height:30px">${I.pin}</span>${esc(s.name)}<span style="margin-left:auto;color:var(--ink-3);font-size:13px;font-weight:600">Départs ${I.chev}</span></button>`).join('')}</div>` : ''}`;
  body.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const f = S.favs[+b.dataset.i]; S.from = findSt(f.from); S.to = findSt(f.to); S.when = null; saveOD(); setTab('plan'); loadConns(); });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.favs.splice(+b.dataset.del, 1); store.set('favs', S.favs); render(); });
  body.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { S.boardSt = findSt(b.dataset.st); store.set('boardSt', S.boardSt.name); setTab('board'); loadBoard(); });
  setRoute({});
}

/* ================= Station picker ================= */
function openPicker(title, cb) {
  const host = $('#pickerHost');
  host.innerHTML = `<div class="picker" role="dialog" aria-label="${esc(title)}">
    <div class="picker-bar"><label class="picker-in">${I.search}<input id="pq" type="search" autofocus placeholder="${esc(title)}" autocomplete="off" enterkeyhint="go"></label>
    <button class="icon-btn lens" id="pClose" aria-label="Fermer">${I.x}</button></div>
    <ul class="picker-list" id="pl"></ul></div>`;
  const q = $('#pq'), list = $('#pl');
  const close = () => { host.innerHTML = ''; };
  $('#pClose').onclick = close;
  const draw = () => {
    const nq = norm(q.value);
    let items;
    if (!nq) { const rec = S.recents.map(findSt).filter(Boolean); items = [...rec, ...S.stations.filter(s => s.tier === 1 || ['Bruxelles-Midi', 'Bruxelles-Central', 'Bruxelles-Nord'].includes(s.name)).filter(s => !rec.includes(s))]; }
    else {
      items = S.stations.map(s => { const n = norm(s.name); const i = n.indexOf(nq); return i < 0 ? null : { s, sc: (i === 0 ? 0 : n[i - 1] === ' ' ? 1 : 2) * 100 + n.length }; })
        .filter(Boolean).sort((a, b) => a.sc - b.sc).slice(0, 60).map(x => x.s);
    }
    list.innerHTML = items.length ? items.map((s, i) => `<li><button data-i="${i}"><span class="pin">${I.pin}</span><span>${esc(s.name)}</span>${S.recents.includes(s.name) && !nq ? '<small>Récent</small>' : ''}</button></li>`).join('')
      : `<li class="empty"><b>Aucune gare</b>Vérifiez l'orthographe, par exemple « Liège » ou « Gand ».</li>`;
    list.querySelectorAll('button').forEach(b => b.onclick = () => { const st = items[+b.dataset.i]; remember(st); close(); cb(st); });
  };
  q.oninput = draw; q.onkeydown = e => { if (e.key === 'Enter') list.querySelector('button')?.click(); if (e.key === 'Escape') close(); };
  q.focus({ preventScroll: true }); draw();
}

/* ================= Sheet drag ================= */
(() => {
  const sheet = $('#sheet');
  const snaps = () => {
    const maxH = Math.round(innerHeight - 8 - ($('.top').getBoundingClientRect().bottom + 10));
    return [Math.max(200, Math.round(maxH * 0.42)), Math.round(maxH * 0.66), maxH];
  };
  let h = snaps()[1], start = null;
  const set = v => { h = v; sheet.style.setProperty('--sheet-h', v + 'px'); };
  set(h);
  const down = e => { if (e.target.closest('button')) return; start = { y: e.clientY, h }; sheet.classList.add('dragging'); e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if (!start) return; const s = snaps(); set(Math.max(s[0] - 40, Math.min(s[2] + 20, start.h - (e.clientY - start.y)))); };
  const up = () => { if (!start) return; start = null; sheet.classList.remove('dragging'); const s = snaps(); set(s.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a)); setTimeout(() => refit(), 460); };
  [$('#grab'), $('#sheetHead')].forEach(el => { el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); });
  addEventListener('resize', () => { const s = snaps(); set(s[1]); if (GL.on) GL.map.resize(); else applyView(); refit(true); });
})();

/* ================= Boot ================= */
async function boot() {
  drawBase();
  refit(true);
  initGL();
  $('#recenter').onclick = () => { GL.follow = true; follow = true; $('#recenter').hidden = true; refit(); };
  const od = store.get('od', null);
  S.from = findSt(od?.from || 'Bruxelles-Central'); S.to = findSt(od?.to || 'Gand-Saint-Pierre');
  S.boardSt = findSt(store.get('boardSt', 'Bruxelles-Central')) || byName.get('Bruxelles-Central');
  S.stack = [{ type: 'plan' }];
  // try live first, quickly
  const status = $('#status');
  try {
    const st = await Promise.race([Live.stations(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
    if (st.length > 50) {
      st.forEach(s => { const d = DEMO_ST.find(x => norm(x.name) === norm(s.name)); if (d) s.tier = d.tier; });
      S.stations = st; S.live = true;
      const remap = x => x && (st.find(s => norm(s.name) === norm(x.name)) || st.find(s => norm(s.name).startsWith(norm(x.name).split(' ')[0])) || x);
      S.from = remap(S.from); S.to = remap(S.to); S.boardSt = remap(S.boardSt);
    }
  } catch {}
  status.classList.toggle('demo', !S.live);
  status.querySelector('span').textContent = S.live ? 'En direct' : 'Démo';
  render(true);
  loadConns();
}
boot();
})();
</script>
